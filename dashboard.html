<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <!-- CSS dashboard dipisahkan dari struktur HTML. -->
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Pesanan dari database ditampilkan oleh dashboard.js. -->
  <div class="dashboard-box">
    <h2 class="dashboard-title">Dashboard Admin</h2>
    <p class="text-center mb-4">Selamat datang, <b>Admin</b>! Anda berhasil login.</p>
    <div class="orders-section">
      <div class="orders-title d-flex justify-content-between align-items-center">
        <span>Daftar Pesanan Terbaru</span>
        <button class="btn btn-outline-primary btn-sm" onclick="renderOrders()">Muat Ulang</button>
      </div>
      <div id="orders-list"></div>
    </div>
    <div class="d-grid gap-2 mt-4">
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
